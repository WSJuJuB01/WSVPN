name: Auto Update VPN Subscriptions

# Настройка триггеров запуска
on:
  schedule:
    # Запуск ровно в начале каждого часа
    - cron: '0 * * * *'
  # Оставляем кнопку для ручного запуска в панели Actions
  workflow_dispatch:

jobs:
  update-subs:
    runs-on: ubuntu-latest

    steps:
    # 1. Клонируем репозиторий
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Устанавливаем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Устанавливаем модуль requests
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. Запускаем парсер
    - name: Run Proxy Parser
      run: python parser67.py

    # 5. Проверяем изменения и пушим в репозиторий
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add sub.txt
        if git diff --staged --quiet; then
          echo "Изменений нет. Пропускаем коммит."
        else
          git commit -m "Ежечасное автоматическое обновление конфигов [GitHub Actions]"
          git push
        fi
